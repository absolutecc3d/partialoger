<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bLogger</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #090909;
    color: #fff;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    text-align: center;
}

h1 {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 25px;
}

.input {
    width: 100%;
    height: 48px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 9px;
    padding: 0 14px;
    color: white;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border 0.2s;
}

.input:focus {
    border-color: #666;
}

.input::placeholder {
    color: #555;
}

.encode-btn {
    width: 100%;
    height: 45px;
    background: white;
    color: #090909;
    border: none;
    border-radius: 9px;
    margin-top: 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.encode-btn:hover {
    background: #ddd;
}

.encode-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.output-section {
    display: none;
    margin-top: 22px;
    animation: appear 0.3s ease;
}

.output-section.show {
    display: block;
}

.output {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 9px;
    padding: 12px;
    color: #ccc;
    font-size: 12px;
    overflow-wrap: anywhere;
    line-height: 1.6;
}

.copy-btn {
    margin-top: 10px;
    background: #222;
    color: white;
    border: 1px solid #333;
    border-radius: 7px;
    padding: 9px 18px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
}

.copy-btn:hover {
    background: #333;
}

.error {
    color: #ff6666;
    font-size: 12px;
    margin-top: 12px;
    display: none;
}

.loader {
    position: fixed;
    inset: 0;
    background: #090909;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
}

.loader.active {
    display: flex;
}

.spinner {
    width: 34px;
    height: 34px;
    border: 3px solid #292929;
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
}

.loading-text {
    font-size: 13px;
    color: #888;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Discord ID to Token</h1>

    <input
        class="input"
        id="input"
        type="text"
        inputmode="numeric"
        maxlength="20"
        placeholder="Put the target ID"
        autocomplete="off"
    >

    <button class="encode-btn" id="encodeBtn" onclick="encodeText()">
        Find →
    </button>

    <div class="error" id="error"></div>

    <div class="output-section" id="outputSection">
        <div class="output" id="output"></div>
        <button class="copy-btn" onclick="copyOutput()" id="copyBtn">
            Copy
        </button>
    </div>

</div>

<div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Finding...</div>
</div>

<script>
const input = document.getElementById('input');
const loader = document.getElementById('loader');
const output = document.getElementById('output');
const outputSection = document.getElementById('outputSection');
const error = document.getElementById('error');
const encodeBtn = document.getElementById('encodeBtn');

let isEncoding = false;

input.addEventListener('input', () => {
    input.value = input.value.replace(/[^0-9]/g, '');
    error.style.display = 'none';
});

function encodeText() {
    if (isEncoding) return;

    const text = input.value;

    if (!/^[0-9]{16,20}$/.test(text)) {
        error.textContent = 'Enter a valid ID.';
        error.style.display = 'block';
        outputSection.classList.remove('show');
        return;
    }

    isEncoding = true;
    encodeBtn.disabled = true;
    loader.classList.add('active');
    outputSection.classList.remove('show');

    const randomDelay = (Math.random() * 5000) + 2000;

    setTimeout(() => {
        const encoded = btoa(text).replace(/=+$/, '') + '*'.repeat(30);

        output.textContent = encoded;
        outputSection.classList.add('show');

        loader.classList.remove('active');
        encodeBtn.disabled = false;
        isEncoding = false;
    }, randomDelay);
}

async function copyOutput() {
    try {
        await navigator.clipboard.writeText(output.textContent);

        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';

        setTimeout(() => {
            btn.textContent = 'Copy';
        }, 1500);
    } catch {
        error.textContent = 'Could not copy output.';
        error.style.display = 'block';
    }
}

input.addEventListener('keydown', event => {
    if (event.key === 'Enter') encodeText();
});
</script>

</body>
</html>
